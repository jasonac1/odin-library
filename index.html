<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="script.js" defer type="text/javascript"></script>
</head>
<body>
    <div class="layout">
        <header>
            <div class="nav">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>magnify</title><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" /></svg>
                <input type="text">
            </div>
            <div class="banner">
                <div class="text">
                    <h1>Curate a collection of your favorite books</h1>
                    <p>Join our community to see other collections you might like!</p>
                </div>
            </div>
        </header>
        <aside>
            <h1>Libraria</h1>
            <nav>
                <ul>
                    <li>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>home</title><path d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z" /></svg>
                        Home
                    </li>
                </ul>
            </nav>
        </aside>
        <main>
            <div class="top-container">
                <h1>My Books</h1>
                <button command="show-modal" commandfor="new-book-form-dialog">New Book</button>
            </div>
            <div class="book-container">
            </div>
        </main>
    </div>
    <dialog id="new-book-form-dialog">
        <form id="new-book-form" action="#">
            <h2>New Book</h2>
            <p>Please complete all required (*) fields</p>
            <div class="form-control">
                <label for="title">Title*</label>
                <input type="text" name="title" id="title" required>
            </div>
            <div class="form-control">
                <label for="author">Author*</label>
                <input type="text" name="author" id="author" required>
            </div>
            <div class="form-control">
                <label for="publisher">Publisher*</label>
                <input type="text" name="publisher" id="publisher" required>
            </div>
            <div class="form-control">
                <label for="date">Year*</label>
                <input type="number" name="year" id="year" required>
            </div>
            <div class="form-actions">
                <button class="cancel" value="cancel" type="button" formmethod="dialog" formnovalidate>Cancel</button>
                <button id="new-book-add" value="add">Add</button>
            </div>
        </form>
    </dialog>
    <dialog id="view-book-dialog">
        <h2>Book Details</h2>
        <div class="book-details">
            <div class="book-detail">
                <h3>ID</h3>
                <p class="book-detail-id"></p>
            </div>
            <div class="book-detail">
                <h3>Title</h3>
                <p class="book-detail-title"></p>
            </div>
            <div class="book-detail">
                <h3>Author</h3>
                <p class="book-detail-author"></p>
            </div>
            <div class="book-detail">
                <h3>Publisher</h3>
                <p class="book-detail-publisher"></p>
            </div>
            <div class="book-detail">
                <h3>Year</h3>
                <p class="book-detail-year"></p>
            </div>
        </div>
        <button class="close">Close</button>
    </dialog>
</body>
</html>
